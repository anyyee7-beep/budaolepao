<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#1f2422;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
.app{width:100%;max-width:430px;margin:0 auto;background:#fff;min-height:100dvh;padding-bottom:max(12px, env(safe-area-inset-bottom))}
.mast{background:linear-gradient(160deg,#d9ffbd 0%,#edffe2 60%,#fff 100%);padding-top:max(8px, env(safe-area-inset-top))}
.nav{height:56px;display:flex;align-items:center;justify-content:center;position:relative;font-size:18px;font-weight:700}
.back{position:absolute;left:17px;top:8px;border-radius:50%;width:40px;height:40px;border:1px solid #cce8ba;display:grid;place-items:center;font-size:30px;font-weight:300;color:#111;text-decoration:none;line-height:1}
.year{display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eff5ec;border-bottom:1px solid #edf2eb;height:52px}
.year span{font-size:15px;color:#999;position:relative}
.year span.active{color:#00b36a;font-weight:650}
.year span.active:after{content:'';position:absolute;width:28px;height:3px;border-radius:8px;background:#50c97a;bottom:-16px;left:50%;transform:translateX(-50%)}
.overview{padding:24px 15px 4px;font-size:11.8px;color:#8e9993;line-height:1.6}
.overview b{color:#09bf69;font-weight:600}
.avatar{height:56px;margin:0 14px 8px}
.avatar span{display:block;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#b8b8b8,#e8e8e8);position:relative;overflow:hidden}
.avatar span:before{content:'';position:absolute;border-radius:50%;width:17px;height:17px;background:#eee;left:14px;top:9px}
.avatar span:after{content:'';position:absolute;border-radius:50%;width:30px;height:24px;background:#eee;left:8px;top:30px}
.record{border-top:6px solid #f6f6f6;padding:15px 14px 14px}
.record:first-of-type{border-top:1px solid #eee}
.record-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#9b9b9b;font-size:12px}
.record-head-right{display:flex;align-items:center;gap:6px}
.tag{background:#f44b52;color:#fff;padding:5px 8px;border-radius:4px;font-size:10px;line-height:1}
.arrow{font-size:24px;line-height:1;color:#777;margin-top:-1px}
.recrow{display:grid;grid-template-columns:34% 1fr;gap:14px;align-items:stretch}
.map{width:100%;height:125px;object-fit:cover;border-radius:2px;background:#8b9da5;display:block}
.data{min-width:0;display:flex;flex-direction:column;justify-content:space-around}
.metric{display:grid;grid-template-columns:1fr 1fr;gap:0}
.metric>div:nth-child(2){border-left:1px solid #ececec;padding-left:13px}
.heading{font-size:11px;color:#3f4442;margin-bottom:12px}
.val{font-size:19px;font-weight:600;white-space:nowrap;color:#111}
.unit{font-size:10px;font-weight:400;color:#9c9c9c;margin-left:2px}
.muted{color:#3cc878}
.lower{padding-top:14px;border-top:1px solid #ededed;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;font-size:11px;white-space:nowrap}
.lower div:nth-child(2){border-left:1px solid #eee;padding-left:12px}
.stripe{margin-top:11px;background:#fff0e9;padding:8px 10px;font-size:11px;color:#535353;border-radius:3px}
@media (max-width:380px){
  .record{padding-left:10px;padding-right:10px}
  .recrow{gap:10px}
  .metric>div:nth-child(2), .lower div:nth-child(2){padding-left:8px}
  .heading,.lower{font-size:10px}
}
@media (min-width:431px){
  body{background:#ededed}
  .app{box-shadow:0 5px 35px #2222}
}
</style>
